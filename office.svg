<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a63"/>
      <stop offset="1" stop-color="#0c2340"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4a5c"/>
      <stop offset="1" stop-color="#232e3b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#wall)"/>
  <rect x="0" y="0" width="640" height="330" fill="#22364f" opacity="0.5"/>
  <!-- window -->
  <rect x="40" y="40" width="220" height="260" rx="4" fill="#a9c6e6" opacity="0.35"/>
  <rect x="40" y="40" width="220" height="260" rx="4" fill="none" stroke="#dce8f5" stroke-width="4" opacity="0.5"/>
  <line x1="150" y1="40" x2="150" y2="300" stroke="#dce8f5" stroke-width="3" opacity="0.5"/>
  <!-- logo mark on wall -->
  <polygon points="440,90 480,170 460,170 440,130 420,170 400,170" fill="#cfe0f5" opacity="0.85"/>
  <text x="440" y="200" text-anchor="middle" fill="#cfe0f5" font-family="Georgia, serif" font-size="20" opacity="0.85">A.A. MUDANYA &amp; CO.</text>
  <text x="440" y="222" text-anchor="middle" fill="#9fc0e8" font-family="Georgia, serif" font-size="12" letter-spacing="2" opacity="0.8">ADVOCATES</text>
  <!-- table -->
  <rect x="60" y="330" width="520" height="70" rx="8" fill="url(#table)"/>
  <rect x="60" y="330" width="520" height="10" rx="4" fill="#4a5b6e"/>
  <!-- chairs -->
  <g fill="#12202f">
    <rect x="90" y="300" width="34" height="60" rx="8"/>
    <rect x="180" y="300" width="34" height="60" rx="8"/>
    <rect x="270" y="300" width="34" height="60" rx="8"/>
    <rect x="360" y="300" width="34" height="60" rx="8"/>
    <rect x="450" y="300" width="34" height="60" rx="8"/>
    <rect x="520" y="300" width="34" height="60" rx="8"/>
  </g>
  <rect x="0" y="400" width="640" height="80" fill="#0a1c33"/>
</svg>
